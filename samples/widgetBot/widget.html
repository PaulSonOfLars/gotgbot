<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Counter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 360px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
        }
        .title { font-size: 14px; opacity: 0.7; margin-bottom: 8px; }
        .count { font-size: 48px; font-weight: bold; margin-bottom: 16px; }
        .buttons { display: flex; gap: 8px; justify-content: center; }
        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
        }
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
<div class="card">
    <div class="title">Interactive Widget Counter</div>
    <div id="count" class="count">0</div>
    <div class="buttons">
        <button id="dec" class="secondary">-1</button>
        <button id="reset" class="secondary">Reset</button>
        <button id="inc">+1</button>
    </div>
</div>

<script>
    const T = window.Telegram && window.Telegram.Widget;
    const countEl = document.getElementById('count');

    function updateCount(val) {
        countEl.textContent = val;
    }

    function initFromChatData() {
        if (!T || !T.chatData) return;
        try {
            const data = JSON.parse(T.chatData);
            if (typeof data.count === 'number') {
                updateCount(data.count);
            }
        } catch (e) {}
    }

    function sendAction(action) {
        if (!T) return;
        T.sendData('counter:' + action, function (err, responseData) {
            if (err) return;
            try {
                const res = JSON.parse(responseData);
                if (typeof res.count === 'number') {
                    updateCount(res.count);
                }
            } catch (e) {}
        });
    }

    document.getElementById('inc').addEventListener('click', () => sendAction('inc'));
    document.getElementById('dec').addEventListener('click', () => sendAction('dec'));
    document.getElementById('reset').addEventListener('click', () => sendAction('reset'));

    if (T) {
        initFromChatData();
        T.onEvent('chatDataChanged', initFromChatData);
    }
</script>
</body>
</html>
